# The route dsh is measured on: the same Ollama Cloud model jozo-harness uses, spoken
# through dsh's pi-ai adapter. The harness copies this into the workspace-local
# DSH_HOME as cordis.patch.yml, so both harnesses run the same model on the same
# endpoint and only the harness differs.
#
# dsh compacts at the smaller of window × 0.8 and window − reserved output −
# headroom. Its requests reserve maxTokens (32,768), so a 52,768 window with
# 4,000 headroom puts the line at 16,000 tokens, where run.ts puts jozo-harness's. The
# summary's own cap would follow headroom down to 4,000; it stays at 8,000.
#
# The 16,000 line is a normalized axis. It is not evidence that the shipped window
# behaves the same, and one A/B cell must run at production defaults; see
# docs/notes/2026-10-19-parity-audit-axes.md.
- id: llm-pi-ai
  config:
    providers:
      ollama-cloud:
        apiKeyEnv: OLLAMA_API_KEY
        api: openai-completions
        baseURL: https://ollama.com/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 52768
            maxTokens: 32768
            input: [text]
- id: compaction-basic
  config:
    headroomTokens: 4000
    maxTokens: 8000
- id: agent-default-model
  config:
    provider: ollama-cloud
    model: deepseek-v4.1-flash

name: base
plugins:
  - id: kernel
    name: '@jozo-harness/kernel'
  - id: sessions
    name: '@jozo-harness/session'
  - id: session-jsonl
    name: '@jozo-harness/session-jsonl'
    config:
      root: ~/.jzh/sessions
  - id: telemetry
    name: '@jozo-harness/session-telemetry-otlp'
    config:
      # Nothing leaves the machine until this row names both an endpoint and a scope.
      scope: off
  - id: tools
    name: '@jozo-harness/tools'
  - id: system-prompt
    name: '@jozo-harness/system-prompt'
  - id: safety
    name: '@jozo-harness/safety'
    config:
      preset: workspace-write
      # Commands run contained by default; auto picks seatbelt on macOS and bwrap on Linux.
      sandbox: auto
  # Runs a workspace's Claude Code / Codex hooks.json at the tool points; no file changes nothing.
  - id: hooks-json
    name: '@jozo-harness/hooks-json'
  - id: tier0
    name: '@jozo-harness/tools-tier0'
  - id: ask
    name: '@jozo-harness/ask'
  - id: tier1
    name: '@jozo-harness/tools-tier1'
  - id: llm
    name: '@jozo-harness/llm-openai'
    config:
      baseUrl: https://ollama.com/v1
      # Requests go to the local daemon, which serves the same cloud models with
      # a prompt cache. baseUrl stays for `jzh models`, which lists from the cloud.
      localBaseUrl: http://127.0.0.1:11434/v1
      apiKeyEnv: OLLAMA_API_KEY
      # The effort words this endpoint takes; the UI offers them as the choices.
      reasoningEfforts: [low, medium, high, xhigh, max]
  - id: agent
    name: '@jozo-harness/agent'
  - id: agent-loop
    name: '@jozo-harness/agent-loop'
    config:
      # One short call names a session after its first message; the session's own
      # route answers unless `model` points elsewhere. A failed call leaves the
      # first line instead, so the row is never blank.
      title:
        maxChars: 60
      # The default route's window, so a 60k session never reaches the line. The
      # key is the route's model name; the local daemon's name is a wire detail.
      models:
        deepseek-v4.1-flash: &default-window
          contextWindow: 1048576
          maxTokens: 393216
          # The model's own effort words win over the endpoint-wide list above.
          reasoningEfforts: [low, medium, high, xhigh, max]
          # No default: a session that names no effort sends no field, as before.
          defaultReasoningEffort: null
        # A route that spells the local daemon's name gets the same window.
        deepseek-v4.1-flash:cloud: *default-window
